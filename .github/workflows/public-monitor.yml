name: Monitor public tennis portals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - players.json
      - monitor.mjs
      - package.json
      - package-lock.json
      - .github/workflows/public-monitor.yml
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scan public tournament pages
        run: npm run monitor
      - name: Save fresh public data
        run: |
          if git diff --quiet -- data.json; then
            echo "No public-data changes"
            exit 0
          fi
          git config user.name "courtwatch-bot"
          git config user.email "courtwatch-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update public tennis findings"
          git push
